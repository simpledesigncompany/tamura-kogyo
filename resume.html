<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>履歴書 | 田村工業</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f5f7fa;
      color: #333;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── 言語バー ── */
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 100;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 12px;
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-btn .divider {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .lang-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 16px;
      background: #fff;
      border: 1px solid #d0d7e2;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      overflow: hidden;
      min-width: 220px;
    }
    .lang-dropdown.open { display: block; }
    .lang-dropdown button {
      display: block;
      width: 100%;
      padding: 13px 20px;
      background: none;
      border: none;
      text-align: left;
      font-size: 15px;
      color: #333;
      cursor: pointer;
    }
    .lang-dropdown .dropdown-title {
      display: block;
      padding: 10px 20px 6px;
      font-size: 11px;
      font-weight: bold;
      color: #999;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid #f0f0f0;
    }
    .lang-dropdown button {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lang-dropdown button .check { color: #1a5fa8; font-size: 13px; width: 14px; }
    .lang-dropdown button:hover { background: #f0f4fb; color: #1a5fa8; }
    .lang-dropdown button:not(:last-child) { border-bottom: 1px solid #f0f0f0; }
    .lang-dropdown button.current { color: #aaa; cursor: default; pointer-events: none; }
    .lang-dropdown button.current:hover { background: none; }

    /* ── ヘッダー ── */
    header {
      background: #1a5fa8;
      color: #fff;
      padding: 20px 16px;
      text-align: center;
      position: relative;
    }
    header h1 { font-size: 22px; font-weight: bold; }
    header p { font-size: 13px; margin-top: 4px; opacity: 0.85; }
    header .lang-bar {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
    }

    /* ── レイアウト ── */
    .container {
      max-width: 680px;
      margin: 24px auto;
      padding: 0 16px 60px;
    }
    .section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #1a5fa8;
      border-left: 4px solid #1a5fa8;
      padding-left: 10px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── フォーム要素 ── */
    .field { margin-bottom: 16px; }
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="date"],
    input[type="number"], input[type="tel"], input[type="month"],
    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d7e2;
      border-radius: 6px;
      font-size: 15px;
      background: #fafbfd;
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a5fa8;
      background: #fff;
    }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      background: #f0f4fb;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #d0d7e2;
      font-weight: normal;
    }
    .radio-group label:has(input:checked),
    .checkbox-group label:has(input:checked) {
      background: #e0eaf8;
      border-color: #1a5fa8;
      color: #1a5fa8;
    }
    .radio-group input, .checkbox-group input { accent-color: #1a5fa8; }

    .photo-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #c0cde0;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: #999;
      font-size: 13px;
      cursor: pointer;
      background: #fafbfd;
    }
    .photo-upload input { display: none; }
    .photo-upload .icon { font-size: 32px; margin-bottom: 8px; }

    .experience-block {
      border: 1px solid #e0e6f0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fafbfd;
    }
    .experience-block .exp-num {
      font-size: 12px;
      color: #1a5fa8;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .nihongo-table { width: 100%; border-collapse: collapse; }
    .nihongo-table th, .nihongo-table td {
      border: 1px solid #e0e6f0;
      padding: 8px 6px;
      font-size: 12px;
      text-align: center;
    }
    .nihongo-table th { background: #f0f4fb; color: #1a5fa8; font-weight: bold; }
    .nihongo-table td:first-child { text-align: left; font-size: 13px; }
    .nihongo-table input[type="checkbox"] { accent-color: #1a5fa8; width: 18px; height: 18px; }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #1a5fa8;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .note {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <h1 data-t="title">履歴書</h1>
  <p>田村工業株式会社 / Tamura Kogyo Co., Ltd.</p>
  <div class="lang-bar">
    <button class="lang-btn" onclick="toggleDropdown()">
      Language <span class="divider">|</span> <span id="current-lang">日本語</span>
    </button>
    <div class="lang-dropdown" id="lang-dropdown">
      <span class="dropdown-title">Language</span>
      <button id="btn-ja" onclick="setLang('ja')"><span class="check" id="check-ja">✓</span>日本語</button>
      <button id="btn-pt" onclick="setLang('pt')"><span class="check" id="check-pt"></span>Português</button>
      <button id="btn-ko" onclick="setLang('ko')"><span class="check" id="check-ko"></span>한국어</button>
      <button id="btn-fil" onclick="setLang('fil')"><span class="check" id="check-fil"></span>Filipino</button>
      <button id="btn-en" onclick="setLang('en')"><span class="check" id="check-en"></span>English</button>
    </div>
  </div>
</header>

<div class="container">
  <form action="#" method="post" enctype="multipart/form-data">

    <!-- 写真 -->
    <div class="section">
      <div class="section-title" data-t="sec_photo">写真</div>
      <label class="photo-upload" for="photo">
        <input type="file" id="photo" name="photo" accept="image/*">
        <div class="icon">📷</div>
        <strong data-t="photo_upload">写真をアップロード</strong>
        <p data-t="photo_tap">タップして写真を追加</p>
      </label>
    </div>

    <!-- 基本情報 -->
    <div class="section">
      <div class="section-title" data-t="sec_basic">基本情報</div>

      <div class="field">
        <label class="field-label" data-t="f_date">作成日</label>
        <input type="date" name="data">
      </div>
      <div class="field">
        <label class="field-label" data-t="f_name">氏名</label>
        <input type="text" name="nome">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_birth">生年月日</label>
          <input type="date" name="nascimento">
        </div>
        <div class="field">
          <label class="field-label" data-t="f_age">年齢</label>
          <input type="number" name="idade" data-t-ph="ph_age" placeholder="歳">
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_gender">性別</label>
        <div class="radio-group">
          <label><input type="radio" name="sexo" value="M"> <span data-t="f_male">男</span></label>
          <label><input type="radio" name="sexo" value="F"> <span data-t="f_female">女</span></label>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_blood">血液型</label>
          <select name="tipo_sanguineo">
            <option value="" data-t="select_ph">選択</option>
            <option>A</option><option>B</option><option>O</option><option>AB</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" data-t="f_pressure">血圧</label>
          <input type="text" name="pressao" data-t-ph="ph_pressure" placeholder="例: 120/80">
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_descendencia">分類</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="descendencia[]" value="issei"> <span data-t="d_issei">一世</span></label>
          <label><input type="checkbox" name="descendencia[]" value="nisei"> <span data-t="d_nisei">二世</span></label>
          <label><input type="checkbox" name="descendencia[]" value="sansei"> <span data-t="d_sansei">三世</span></label>
          <label><input type="checkbox" name="descendencia[]" value="mestico"> <span data-t="d_mestico">混血</span></label>
          <label><input type="checkbox" name="descendencia[]" value="brasileiro"> <span data-t="d_brasileiro">日系外国人</span></label>
        </div>
      </div>
    </div>

    <!-- 連絡先 -->
    <div class="section">
      <div class="section-title" data-t="sec_contact">連絡先</div>

      <div class="field">
        <label class="field-label" data-t="f_address">住所</label>
        <input type="text" name="endereco" data-t-ph="ph_address" placeholder="住所">
      </div>
      <div class="field">
        <label class="field-label" data-t="f_address_change">住所変更</label>
        <div class="radio-group">
          <label><input type="radio" name="mudanca" value="sim"> <span data-t="f_sim">はい</span></label>
          <label><input type="radio" name="mudanca" value="nao"> <span data-t="f_nao">いいえ</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_email">メール</label>
        <input type="email" name="email" placeholder="example@email.com">
      </div>
      <div class="field">
        <label class="field-label" data-t="f_phone">携帯番号</label>
        <input type="tel" name="celular" placeholder="090-0000-0000">
      </div>
    </div>

    <!-- 身体・資格 -->
    <div class="section">
      <div class="section-title" data-t="sec_physical">身体・資格</div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_height">身長</label>
          <input type="number" name="altura" data-t-ph="ph_height" placeholder="cm">
        </div>
        <div class="field">
          <label class="field-label" data-t="f_weight">体重</label>
          <input type="number" name="peso" data-t-ph="ph_weight" placeholder="kg">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_uniform">服のサイズ</label>
          <select name="tam_uniforme">
            <option value="" data-t="select_ph">選択</option>
            <option>XS</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" data-t="f_shoes">靴のサイズ</label>
          <input type="number" name="tam_sapato" data-t-ph="ph_shoes" placeholder="cm">
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_vision">視力</label>
        <input type="text" name="visao" data-t-ph="ph_vision" placeholder="右 / 左">
      </div>
      <div class="field">
        <label class="field-label" data-t="f_health">病歴・健康状態</label>
        <textarea name="saude" rows="2" data-t-ph="ph_health" placeholder="特記事項があれば記入"></textarea>
      </div>
    </div>

    <!-- 在留資格 -->
    <div class="section">
      <div class="section-title" data-t="sec_visto">在留資格</div>

      <div class="field">
        <label class="field-label" data-t="f_visto">ビザ・再入国有効期限</label>
        <input type="date" name="visto">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_passport_nr">パスポート番号</label>
          <input type="text" name="passaporte_nr">
        </div>
        <div class="field">
          <label class="field-label" data-t="f_valid">有効期限</label>
          <input type="date" name="passaporte_valid">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-t="f_gaikokujin">外国人登録番号</label>
          <input type="text" name="gaikokujin_nr">
        </div>
        <div class="field">
          <label class="field-label" data-t="f_valid">有効期限</label>
          <input type="date" name="gaikokujin_valid">
        </div>
      </div>
    </div>

    <!-- 免許・その他 -->
    <div class="section">
      <div class="section-title" data-t="sec_habilitacao">免許・その他</div>

      <div class="field">
        <label class="field-label" data-t="f_lifto">フォークリフト</label>
        <div class="radio-group">
          <label><input type="radio" name="lifto" value="sim"> <span data-t="f_sim">はい</span></label>
          <label><input type="radio" name="lifto" value="nao"> <span data-t="f_nao">いいえ</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_cart">運転免許</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="cart[]" value="brasil"> <span data-t="cart_brasil">ブラジル</span></label>
          <label><input type="checkbox" name="cart[]" value="japao"> <span data-t="cart_japao">日本</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_bicicleta">自転車に乗れますか</label>
        <div class="radio-group">
          <label><input type="radio" name="bicicleta" value="sim"> <span data-t="f_bike_yes">乗れる</span></label>
          <label><input type="radio" name="bicicleta" value="nao"> <span data-t="f_bike_no">乗れない</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_tatuagem">刺青</label>
        <div class="radio-group">
          <label><input type="radio" name="tatuagem" value="sim"> <span data-t="f_tattoo_yes">有り</span></label>
          <label><input type="radio" name="tatuagem" value="nao"> <span data-t="f_tattoo_no">無し</span></label>
        </div>
      </div>
    </div>

    <!-- 学歴・家族 -->
    <div class="section">
      <div class="section-title" data-t="sec_escola">学歴・家族</div>

      <div class="field">
        <label class="field-label" data-t="f_escolaridade">最終学歴</label>
        <div class="radio-group">
          <label><input type="radio" name="escolaridade" value="1c"> <span data-t="esc_1c">中学 / 卒業</span></label>
          <label><input type="radio" name="escolaridade" value="1i"> <span data-t="esc_1i">中学 / 中退</span></label>
          <label><input type="radio" name="escolaridade" value="2c"> <span data-t="esc_2c">高校 / 卒業</span></label>
          <label><input type="radio" name="escolaridade" value="2i"> <span data-t="esc_2i">高校 / 中退</span></label>
          <label><input type="radio" name="escolaridade" value="sc"> <span data-t="esc_sc">大学 / 卒業</span></label>
          <label><input type="radio" name="escolaridade" value="si"> <span data-t="esc_si">大学 / 中退</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_civil">婚姻状況</label>
        <div class="radio-group">
          <label><input type="radio" name="civil" value="casado"> <span data-t="f_casado">既婚</span></label>
          <label><input type="radio" name="civil" value="solteiro"> <span data-t="f_solteiro">未婚</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_diabete">糖尿病</label>
        <div class="radio-group">
          <label><input type="radio" name="diabete" value="sim"> <span data-t="f_sim">はい</span></label>
          <label><input type="radio" name="diabete" value="nao"> <span data-t="f_nao">いいえ</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_alergia">アレルギー</label>
        <div class="radio-group">
          <label><input type="radio" name="alergia" value="sim"> <span data-t="f_sim">はい</span></label>
          <label><input type="radio" name="alergia" value="nao"> <span data-t="f_nao">いいえ</span></label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-t="f_filhos">日本に子供</label>
        <div class="radio-group">
          <label><input type="radio" name="filhos" value="sim"> <span data-t="f_sim">はい</span></label>
          <label><input type="radio" name="filhos" value="nao"> <span data-t="f_nao">いいえ</span></label>
        </div>
      </div>
    </div>

    <!-- 勤務経験 -->
    <div class="section">
      <div class="section-title" data-t="sec_exp">勤務経験</div>

      <div class="experience-block">
        <div class="exp-num">1</div>
        <div class="field"><label class="field-label" data-t="f_empresa">勤務先名称</label><input type="text" name="empresa_1"></div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_produto">製造品</label><input type="text" name="produto_1"></div>
          <div class="field"><label class="field-label" data-t="f_servico">職種</label><input type="text" name="servico_1"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_periodo_start">期間（開始）</label><input type="month" name="periodo_inicio_1"></div>
          <div class="field"><label class="field-label" data-t="f_periodo_end">期間（終了）</label><input type="month" name="periodo_fim_1"></div>
        </div>
        <div class="field"><label class="field-label" data-t="f_demissao">退職理由</label><input type="text" name="demissao_1"></div>
      </div>

      <div class="experience-block">
        <div class="exp-num">2</div>
        <div class="field"><label class="field-label" data-t="f_empresa">勤務先名称</label><input type="text" name="empresa_2"></div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_produto">製造品</label><input type="text" name="produto_2"></div>
          <div class="field"><label class="field-label" data-t="f_servico">職種</label><input type="text" name="servico_2"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_periodo_start">期間（開始）</label><input type="month" name="periodo_inicio_2"></div>
          <div class="field"><label class="field-label" data-t="f_periodo_end">期間（終了）</label><input type="month" name="periodo_fim_2"></div>
        </div>
        <div class="field"><label class="field-label" data-t="f_demissao">退職理由</label><input type="text" name="demissao_2"></div>
      </div>

      <div class="experience-block">
        <div class="exp-num">3</div>
        <div class="field"><label class="field-label" data-t="f_empresa">勤務先名称</label><input type="text" name="empresa_3"></div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_produto">製造品</label><input type="text" name="produto_3"></div>
          <div class="field"><label class="field-label" data-t="f_servico">職種</label><input type="text" name="servico_3"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label" data-t="f_periodo_start">期間（開始）</label><input type="month" name="periodo_inicio_3"></div>
          <div class="field"><label class="field-label" data-t="f_periodo_end">期間（終了）</label><input type="month" name="periodo_fim_3"></div>
        </div>

const LANG_CODE = { ja: 'ja', pt: 'pt', ko: 'ko', fil: 'fil', en: 'en' };

let currentLang = localStorage.getItem('lang') || 'ja';

function applyLang(lang) {
  const d = T[lang];
  if (!d) return;
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (d[key] !== undefined) el.textContent = d[key];
  });
  document.querySelectorAll('[data-t-ph]').forEach(el => {
    const key = el.getAttribute('data-t-ph');
    if (d[key] !== undefined) el.placeholder = d[key];
  });
  document.getElementById('current-lang').textContent = d.lang_label;
  updateLangButtons(lang);
  const langCode = LANG_CODE[lang] || lang;
  document.documentElement.lang = langCode;
  document.querySelectorAll('input[type="date"], input[type="month"]').forEach(el => {
    el.setAttribute('lang', langCode);
  });
  currentLang = lang;
  localStorage.setItem('lang', lang);
  closeDropdown();
}

function toggleDropdown() {
  document.getElementById('lang-dropdown').classList.toggle('open');
}
function closeDropdown() {
  document.getElementById('lang-dropdown').classList.remove('open');
}
function setLang(lang) { applyLang(lang); }
function updateLangButtons(lang) {
  ['ja', 'pt', 'ko', 'fil', 'en'].forEach(l => {
    const btn = document.getElementById('btn-' + l);
    const check = document.getElementById('check-' + l);
    if (!btn || !check) return;
    if (l === lang) {
      btn.classList.add('current');
      check.textContent = '✓';
    } else {
      btn.classList.remove('current');
      check.textContent = '';
    }
  });
}

// 外側クリックで閉じる
document.addEventListener('click', e => {
  if (!e.target.closest('.lang-bar')) closeDropdown();
});

// 初期化
applyLang(currentLang);
</script>
