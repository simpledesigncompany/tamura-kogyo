<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>デザイン確認 | 田村工業</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #fff;
    }
    header {
      background: #1a5fa8;
      padding: 16px 24px;
      text-align: center;
    }
    header h1 { font-size: 18px; font-weight: bold; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .group-label {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      padding: 40px 24px 0;
      border-top: 1px solid #333;
      margin-top: 40px;
    }
    .group-label:first-of-type { border-top: none; margin-top: 0; }
    .section {
      padding: 24px 0 0;
    }
    .section-label {
      font-size: 12px;
      color: #aaa;
      padding: 0 24px 10px;
      letter-spacing: 0.05em;
    }
    .section img {
      display: block;
      width: 100%;
      height: auto;
    }
    .section.mobile {
      display: flex;
      justify-content: center;
    }
    .section.mobile img {
      width: 390px;
      max-width: 100%;
    }
    footer {
      padding: 32px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>田村工業様 — デザイン確認</h1>
  <p>2026.10.18</p>
</header>

<p class="group-label">PC</p>

<div class="section">
  <p class="section-label">トップページ</p>
  <img src="images/toppage-pc.jpg" alt="トップページ PC">
</div>

<div class="section">
  <p class="section-label">求人情報一覧ページ</p>
  <img src="images/works-list-pc.jpg" alt="求人情報一覧 PC">
</div>

<div class="section">
  <p class="section-label">求人情報詳細ページ</p>
  <img src="images/works-detail.jpg" alt="施工実績 詳細">
</div>

<p class="group-label">モバイル</p>

<div class="section mobile">
  <div>
    <p class="section-label">トップページ</p>
    <img src="images/toppage-mobile.jpg" alt="トップページ モバイル">
  </div>
</div>

<div class="section mobile">
  <div>
    <p class="section-label">求人情報一覧ページ</p>
    <img src="images/works-list-mobile.jpg" alt="求人情報一覧 モバイル">
  </div>
</div>

<footer>SIMPLE DESIGN株式会社</footer>

</body>
</html>
