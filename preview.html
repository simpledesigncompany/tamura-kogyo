<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>デザイン確認 | 田村工業</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #fff;
    }
    header {
      background: #1a5fa8;
      padding: 16px 24px;
      text-align: center;
    }
    header h1 { font-size: 18px; font-weight: bold; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .section {
      padding: 32px 0 0;
    }
    .section-label {
      font-size: 13px;
      color: #aaa;
      padding: 0 24px 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .section img {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      padding: 32px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>田村工業 — デザイン確認</h1>
  <p>2026.10.18</p>
</header>

<div class="section">
  <p class="section-label">トップページ — PC</p>
  <img src="images/toppage-pc.jpg" alt="トップページ PC">
</div>

<div class="section">
  <p class="section-label">トップページ — モバイル</p>
  <img src="images/toppage-mobile.jpg" alt="トップページ モバイル">
</div>

<div class="section">
  <p class="section-label">施工実績一覧 — PC</p>
  <img src="images/works-list-pc.jpg" alt="施工実績一覧 PC">
</div>

<div class="section">
  <p class="section-label">施工実績一覧 — モバイル</p>
  <img src="images/works-list-mobile.jpg" alt="施工実績一覧 モバイル">
</div>

<div class="section">
  <p class="section-label">施工実績 詳細</p>
  <img src="images/works-detail.jpg" alt="施工実績 詳細">
</div>

<footer>SIMPLE DESIGN株式会社</footer>

</html>
